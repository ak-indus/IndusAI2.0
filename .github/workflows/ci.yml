name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  frontend:
    name: Frontend (Lint, Type-check, Test, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Backend (Lint, Type-check, Integration Tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: indusai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "ruff==0.16.0" mypy

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy)
        run: mypy main.py --ignore-missing-imports --no-strict-optional
        continue-on-error: true

      - name: Integration tests (pytest)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/indusai_test
          SECRET_KEY: ci-integration-test-secret-key-32ch!
        run: pytest tests/ -v
